</head><body><header><div><small>PORTFOLIO / MOTION STUDIO</small><h1>让每一页，按你的节奏移动。</h1></div><a href="/" target="_blank" rel="noopener">打开作品集 ↗</a></header><main><aside><label for="page">选择页面</label><select id="page"></select><section><h2>整页移动强度</h2><div id="page-controls"></div><p>翻页强度 × 素材水平幅度 = 翻页时的移动距离。0 表示不移动；负数让素材反向移动。</p></section><section><h2>本页的素材组</h2><p>同组素材一起移动。纸张与上面的文字会保持对齐。</p><div id="groups"></div></section><section class="save-controls"><button id="save" class="primary">保存并应用到本机网站</button><div class="two"><button id="export">导出 JSON</button><button id="import-button">导入 JSON</button></div><input id="import" type="file" accept=".json,application/json" hidden><div class="two"><button id="reset-page">重置本页</button><button id="restore">撤销未保存调整</button></div><p id="status" role="status" aria-live="polite">正在加载预览，稍候即可调整。</p><p>保存仅作用于当前浏览器和网址。换设备可导入 JSON；修改后先保存，再刷新已打开的作品集。</p></section></aside><article><div class="toolbar"><div><strong id="page-title">真实书本预览</strong><p>滑动下方进度，慢慢看素材怎么动。</p></div><button id="replay" disabled>试翻这一页</button></div><div class="preview"><iframe id="preview" title="逐页动效实时预览" src="/?motion-preview=1"></iframe></div><div class="scrub"><label for="progress">翻页进度 <output id="progress-value">0%</output></label><input id="progress" type="range" min="0" max="95" step="1" value="0"><button id="settle">回到本页</button></div><div class="note"><strong>怎么试？</strong><p>第二页先调「手机拼图」的水平幅度，第三页调「左侧整组」。调整会立即显示在预览里，但不会自动覆盖已保存的配置。</p></div></article></main></body></html>
