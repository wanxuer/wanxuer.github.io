</head><body><header><h1>Selected Work</h1><a href="/#page-2">返回书本</a><button id="save" class="primary">保存到本机书页</button><button id="export">导出配置</button><button id="png">导出效果图</button></header><main><section class="stage" aria-label="作品墙预览"><canvas id="preview" width="1659" height="948" aria-label="13 个可替换图片相框，使用右侧选择器编辑"></canvas></section><aside><p>选择相框，放入 App 截图或人物照片。PNG 透明人物也可直接放入，相框外的背景和挂件不会改变。</p><label>当前相框<select id="card"></select></label><label>替换图片<input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label><label>图片显示<select id="fit"><option value="contain">完整显示</option><option value="cover">铺满裁切</option></select></label><label>沿绳子移动<input id="x" type="range" min="40" max="1610" step="1"></label><label>倾斜角度<input id="angle" type="range" min="-20" max="20" step="1"></label><label>标题文字<input id="title" value="Selected Work" maxlength="50"></label><label>标题透明度<input id="opacity" type="range" min="0" max="0.6" step="0.01"></label><button id="remove">移除当前图片</button><button id="empty">暂时隐藏全部图片</button><label>导入配置<input id="import" type="file" accept="application/json,.json"></label><button id="reset">还原默认布局</button><p id="status" role="status" aria-live="polite">正在载入独立素材…</p></aside></main><footer>图片仅在本机处理，不上传。保存后在同一浏览器的书本第二跨页查看；导出配置可备份图片和布局。默认花体标题为独立图片，改字后使用系统斜体。</footer></body></html>
